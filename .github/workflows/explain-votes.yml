name: Explain new votes

# Every few minutes: find new House and Senate passage votes, write plain-English explanations
# from the official record with Claude, and publish them to explainers/v1.json for the app.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: explain-votes
  cancel-in-progress: false

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: python -m pip install --quiet "anthropic>=0.125,<2"

      - name: Explain new votes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -I tools/explain_votes.py

      # Runs even when the step above fails, so progress on other votes is kept.
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explainers/
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "Update vote explanations"
          git pull --quiet --rebase
          git push --quiet
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || true
